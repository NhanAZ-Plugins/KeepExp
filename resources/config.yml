---
# true: Keep experience on death in worlds selected below.
# false: Use the server's normal experience loss behavior.
keepExp: true

# realExp: Keep all current experience.
# droppedExp: Keep only the amount that would normally drop on death.
typeExp: realExp

# all: Protect players in every world.
# whitelist: Protect only the listed worlds.
# blacklist: Protect every world except those listed.
mode: all
worlds: []
# Example: ["world1", "world2"]

# Message sent to players after respawn
msgAfterRespawn: "You died, but your experience is safe!"

# Title of toast
toastTitle: "KeepExp"

# none: Do not send a respawn message.
# message, title, popup, tip, actionbar or toast: Choose one display method.
msgType: none
