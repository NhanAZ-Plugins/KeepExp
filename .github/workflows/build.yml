name: Build and validate plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test experience protection rules
    runs-on: ubuntu-24.04
    steps:
      - name: Check out KeepExp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run world protection cases
        run: php tests/protection-policy.php

  build:
    needs: test
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@latest
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
